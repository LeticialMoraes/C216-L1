services:
  db:
    image: postgres:15
    container_name: aula6_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: professores
    ports:
      - "5434:5432"
    volumes:
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d professores"]
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: aula6_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/professores
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: aula6_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
